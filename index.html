<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>셔틀 매치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 체육관 중계처럼 경쾌하고 굵직하게
   IDEA: 실내 배드민턴 경기장 — 녹색 코트 매트, 나무 바닥, 진홍색 관중석, 전광판 점수
   PICTURE: 가로 화면 전체가 경기장, 캐릭터 선수 둘과 셔틀콕
   COLOUR and TYPE: 관중석 진홍 + 코트 녹색 + 셔틀 금색 강조 / Black Han Sans + Noto Sans KR
   LAYOUT: 화면 꽉 찬 가로 캔버스, 위 가운데 전광판, 아래 양쪽 터치 버튼, 메뉴는 가운데 카드 */
:root{color-scheme:light dark;--bg:light-dark(#3d0b14,#2a070e);--ink:#f6efe0;--board:#15181f;--gold:#f2b631;--cream:#f6efe0}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{color:var(--ink);font:16px/1.5 'Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;touch-action:none;container-type:size;background:#3d0b14}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;min-height:44px;border-radius:12px;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.disp{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}
#hud{position:absolute;top:8px;left:64px;right:64px;display:flex;justify-content:center;align-items:center;gap:6px;pointer-events:none}
.sc{position:relative;flex:none;display:flex;align-items:center;gap:8px;background:rgba(21,24,31,.9);border-radius:10px;padding:4px 12px 14px;min-height:52px}
.gau{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:rgba(246,239,224,.14);overflow:hidden}
.gau i{display:block;height:100%;width:0;background:#b07cff;border-radius:2px}
.gau.full i{background:linear-gradient(90deg,#b07cff,#ffd23f,#b07cff);background-size:200% 100%;animation:gl 1s linear infinite}
@keyframes gl{to{background-position:-200% 0}}
.sta{position:absolute;left:10px;right:10px;bottom:8px;height:4px;border-radius:2px;background:rgba(246,239,224,.18);overflow:hidden}
.sta i{display:block;height:100%;width:100%;background:#4cd18a;border-radius:2px}
.sc b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(24px,8cqh,40px);line-height:1;color:var(--gold);min-width:1.3em;text-align:center;font-variant-numeric:tabular-nums}
.nm{font-size:14px;font-weight:700;max-width:7.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.sv{flex:none;white-space:nowrap;font-size:13px;font-weight:700;color:#15181f;background:var(--gold);border-radius:6px;padding:0 5px;visibility:hidden}
.srv .sv{visibility:visible}
.mid{flex:none;font-size:13px;background:rgba(21,24,31,.75);border-radius:8px;padding:3px 8px;white-space:nowrap}
#stat{position:absolute;top:calc(8px + 52px + 6px);left:50%;transform:translateX(-50%);font-size:13px;background:rgba(21,24,31,.75);border-radius:8px;padding:3px 10px;white-space:nowrap;pointer-events:none}
#stat:empty{display:none}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .18s,transform .18s}
#msg.on{opacity:1;transform:none}
#msg b{display:block;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(34px,13cqh,64px);line-height:1.05;color:var(--gold);text-shadow:0 3px 0 #15181f,0 0 18px rgba(0,0,0,.5)}
#msg span{display:inline-block;margin-top:6px;font-size:15px;font-weight:700;background:rgba(21,24,31,.8);border-radius:8px;padding:2px 10px}
#msg span:empty{display:none}
#bM{position:absolute;top:8px;left:10px;width:48px;background:rgba(21,24,31,.75);display:grid;place-items:center}
#bM svg{width:22px;height:22px}
#pad{position:absolute;left:12px;bottom:10px;display:flex;width:clamp(160px,min(52cqh,26cqw),310px);height:clamp(84px,min(30cqh,15cqw),140px);border-radius:999px;background:rgba(21,24,31,.42);border:2px solid rgba(246,239,224,.35);touch-action:none}
.pk{flex:1;display:grid;place-items:center;border-radius:999px;pointer-events:auto}
.pk svg{width:34%;height:46%;pointer-events:none}
.pk.on{background:rgba(246,239,224,.3)}
#acts{position:absolute;right:10px;bottom:8px;display:flex;gap:7px;align-items:flex-end}
.ab{position:relative;width:clamp(58px,min(24cqh,10.6cqw),104px);height:clamp(58px,min(24cqh,10.6cqw),104px);border-radius:50%;border:2px solid rgba(246,239,224,.45);background:rgba(21,24,31,.5);color:var(--cream);display:grid;place-content:center;line-height:1.1;padding:0;touch-action:none;transition:transform .06s}
.ab b{font-size:19px;font-weight:700}
.ab small{font-size:14px;font-weight:500;opacity:.85}
.ab.sw{width:clamp(80px,min(33cqh,14.2cqw),136px);height:clamp(80px,min(33cqh,14.2cqw),136px);background:rgba(242,182,49,.9);color:#15181f;border-color:transparent}
.ab.sw b{font-size:25px}
.ab.sm{background:rgba(214,48,58,.88);border-color:rgba(255,220,200,.5)}
.ab.on{transform:scale(.9)}
.ab.best{box-shadow:0 0 0 4px #7fd4ff,0 0 22px 6px rgba(127,212,255,.75);animation:dsb .5s ease-in-out infinite alternate}
@keyframes dsb{to{box-shadow:0 0 0 6px #bfe9ff,0 0 30px 10px rgba(127,212,255,.9)}}
.ab.sk{background:conic-gradient(var(--skc,#b07cff) calc(var(--g,0) * 1%),rgba(21,24,31,.55) 0);border-color:rgba(246,239,224,.3)}
.ab.sk::before{content:'';position:absolute;inset:5px;border-radius:50%;background:rgba(21,24,31,.85)}
.ab.sk>*{position:relative}
.ab.sk.ready{border-color:#fff;animation:skr .6s ease-in-out infinite alternate}
.ab.sk.act{border-color:var(--skc)}
.ab[hidden]{display:none}
#ping{position:absolute;left:12px;top:62px;font:700 12px/1 'Noto Sans KR',sans-serif;padding:4px 7px;border-radius:8px;background:rgba(10,12,18,.6);z-index:6;pointer-events:none}
#ping[hidden]{display:none}
#bSkill2{position:absolute;right:calc(100% + 8px);bottom:0;width:clamp(50px,min(20cqh,8.5cqw),82px);height:clamp(50px,min(20cqh,8.5cqw),82px)}
#bSkill2 b{font-size:15px}#bSkill2 small{font-size:12px}
@keyframes skr{from{box-shadow:0 0 0 0 var(--skc)}to{box-shadow:0 0 16px 4px var(--skc)}}
#cut{position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:7cqh;pointer-events:none;overflow:hidden;opacity:0}
#cut .band{width:150%;padding:8px 0 10px;text-align:center;transform:rotate(-6deg);background:linear-gradient(90deg,transparent,var(--skc) 18%,var(--skc) 82%,transparent);color:#15181f}
#cut b{display:block;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(34px,13cqh,60px);line-height:1.05}
#cut span{font-size:15px;font-weight:700}
#cut.on{animation:cutf 1.5s ease forwards}
#cut.on .band{animation:cutb 1.5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes cutf{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes cutb{0%{transform:rotate(-6deg) translateX(-40%)}18%{transform:rotate(-6deg) translateX(0)}82%{transform:rotate(-6deg) translateX(2%)}100%{transform:rotate(-6deg) translateX(35%)}}
.sk-line b{font-weight:700}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,8,12,.55);padding:10px}
.card{background:var(--board);border-radius:18px;padding:clamp(14px,4cqh,26px);width:min(760px,100%);max-height:100%;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.45);touch-action:pan-y}
.card.sm{width:min(460px,100%);text-align:center}
.wide{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(14px,3cqw,28px);align-items:start}
@container (max-width:600px){.wide{grid-template-columns:1fr}}
h1{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(34px,12cqh,52px);line-height:1.05;color:var(--gold);text-wrap:balance}
h2{margin:0 0 4px;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(26px,9cqh,36px);line-height:1.05;color:var(--gold)}
.sub{margin:4px 0 10px;font-size:14px;opacity:.85}
.how{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:0;font-size:14px;line-height:1.4}
.how dt{font-weight:700;color:var(--gold);white-space:nowrap}
.how dd{margin:0;opacity:.92}
.lbl{font-size:13px;opacity:.8;margin:10px 0 6px;font-weight:700}
.lbl:first-child{margin-top:0}
.seg{display:flex;background:rgba(246,239,224,.1);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;font-size:15px;font-weight:700}
.seg button.on{background:var(--cream);color:#15181f}
.big{display:block;width:100%;margin-top:8px;background:var(--gold);color:#15181f;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;padding:10px 16px;min-height:58px;border-radius:14px}
.big.alt{background:var(--cream)}
.big:disabled{opacity:.4;cursor:default}
.ghost{background:rgba(246,239,224,.12);font-weight:700;font-size:15px;padding:8px 14px}
.note{font-size:13px;opacity:.85;margin:8px 0 0;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.row>*{flex:1 1 140px}
.nmrow{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;margin:8px 0 4px;flex-wrap:wrap}
input{font:16px 'Noto Sans KR',sans-serif;background:rgba(246,239,224,.1);border:2px solid rgba(246,239,224,.25);color:var(--cream);border-radius:10px;padding:6px 10px;min-height:44px;width:11em;-webkit-user-select:text;user-select:text}
.seats{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;margin:10px 0 4px}
.seat{background:rgba(246,239,224,.07);border:2px solid rgba(246,239,224,.18);padding:10px 12px;text-align:left;display:grid;gap:1px;min-height:84px}
.seat.mine{border-color:var(--gold)}
.seat:disabled{cursor:default}
.seat .t{font-size:13px;opacity:.8;display:flex;gap:6px;align-items:center}
.seat .n{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:22px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .a{font-size:13px;opacity:.8}
.vs{font-family:'Black Han Sans',sans-serif;font-size:22px;color:var(--gold)}
.bigscore{font-family:'Black Han Sans',sans-serif;font-size:clamp(36px,13cqh,60px);line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
body.intro #hud,body.intro #hud *,body.intro #ctl,body.intro #ctl *,body.intro #bM{visibility:hidden!important}
.chars{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;margin-top:8px}
@container (max-width:600px){.chars{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ch{background:rgba(246,239,224,.07);border:2px solid rgba(246,239,224,.16);padding:2px 1px 4px;display:grid;justify-items:center;gap:0;text-align:center;line-height:1.2;min-height:0;border-radius:10px}
.ch.on{border-color:var(--gold);background:rgba(242,182,49,.14)}
.ch canvas{width:100%;height:clamp(44px,15cqh,76px);display:block}
.ch b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:13px;white-space:nowrap}
select{font:700 15px 'Noto Sans KR',sans-serif;background:rgba(246,239,224,.1);color:var(--cream);border:2px solid rgba(246,239,224,.25);border-radius:10px;min-height:44px;padding:6px 10px;width:100%}
select option{color:#15181f}
.ch span{font-size:13px;color:var(--gold);font-weight:700;white-space:nowrap}
.chead{display:flex;align-items:baseline;gap:8px}
.cn{font-family:'Black Han Sans',sans-serif;font-size:26px;line-height:1.1}
.cr{font-size:14px;color:var(--gold);font-weight:700}
.cs{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 8px;align-items:center;margin-top:2px;font-size:13px;line-height:1.32}
.cs i{display:block;height:6px;border-radius:3px;background:rgba(246,239,224,.15);overflow:hidden}
.cs i i{height:100%;background:var(--gold)}
.cs em{font-style:normal;opacity:.75;font-variant-numeric:tabular-nums;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:rgba(246,239,224,.1);font-weight:700;font-size:14px;padding:6px 12px}
.chips button.on{background:var(--cream);color:#15181f}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(21,24,31,.92);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}#cut.on .band,.ab.sk.ready{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="sc" id="hL"><span class="dot"></span><span class="nm"></span><span class="sv">서브</span><b>0</b><i class="sta" title="체력"><i></i></i><i class="gau" title="스킬 게이지"><i></i></i></div>
    <div class="mid" id="hMid">11점 선승</div>
    <div class="sc" id="hR"><b>0</b><span class="sv">서브</span><span class="nm"></span><span class="dot"></span><i class="sta" title="체력"><i></i></i><i class="gau" title="스킬 게이지"><i></i></i></div>
  </div>
  <div id="stat"></div>
  <div id="msg"><b></b><span></span></div>
  <div id="ping" hidden></div>
  <button id="bM" aria-label="메뉴" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div id="ctl" hidden>
    <div id="pad">
      <div class="pk" data-d="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="pk" data-d="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
    </div>
    <div id="acts">
      <button class="ab sk s2" id="bSkill2" hidden><b>스킬2</b><small>-</small></button>
      <button class="ab sk" id="bSkill"><b>스킬</b><small>집중</small></button>
      <button class="ab" id="bJump"><b>점프</b><small>길게</small></button>
      <button class="ab" id="bSoft"><b>드롭</b><small>헤어핀</small></button>
      <button class="ab sm" id="bSmash"><b>스매시</b></button>
      <button class="ab sw" id="bSwing"><b>스윙</b><small>클리어</small></button>
    </div>
  </div>

  <div class="ov" id="menu">
    <div class="card wide">
      <div>
        <h1>셔틀 매치</h1>
        <p class="sub">가로로 즐기는 배드민턴 · 11점 선승(듀스면 2점 차, 최대 15점)</p>
        <dl class="how" id="how"></dl>
      </div>
      <div>
        <div class="lbl">컴퓨터와 대결</div>
        <div class="seg" id="diffSeg"><button data-d="easy">쉬움</button><button data-d="normal" class="on">보통</button><button data-d="hard">어려움</button><button data-d="hell">지옥</button></div>
        <button class="big" id="bResume" hidden>계속하기</button>
        <button class="big" id="bCpu">경기 시작</button>
        <div class="lbl">친구와 대결</div>
        <button class="big alt" id="bOnline" disabled>온라인 대결</button>
        <p class="note" id="onNote">온라인 연결 확인 중…</p>
        <div class="row"><button class="ghost" id="bSound">소리 켜짐</button><button class="ghost" id="bMark">착지 표시 켬</button><button class="ghost" id="bLite">그래픽: 가볍게</button></div>
      </div>
    </div>
  </div>

  <div class="ov" id="pick" hidden>
    <div class="card wide">
      <div>
        <h2>선수 선택</h2>
        <div class="chars" id="charGrid"></div>
      </div>
      <div>
        <div class="chead"><span class="cn" id="pkName"></span><span class="cr" id="pkRole"></span></div>
        <p class="note" id="pkDesc"></p>
        <p class="note sk-line" id="pkSkill"></p>
        <div class="cs" id="pkStats"></div>
        <div class="lbl">상대 컴퓨터</div>
        <select id="oppSel" aria-label="상대 컴퓨터 선수"></select>
        <div class="row"><button class="big" id="bGo">시작</button><button class="big alt" id="bPickBack">뒤로</button></div>
      </div>
    </div>
  </div>

  <div class="ov" id="lobby" hidden>
    <div class="card">
      <h2>온라인 대결</h2>
      <label class="nmrow">내 이름 <input id="nick" maxlength="10" autocomplete="off"></label>
      <div class="nmrow">내 선수 <div class="chips" id="lobChips"></div></div>
      <div class="nmrow" id="roomRow" hidden>방 코드 <b id="roomCode" style="font-size:20px;letter-spacing:2px;color:#f2b631"></b>
        <button class="ghost" id="bCopy">초대 링크 복사</button>
        <input id="roomIn" maxlength="8" placeholder="다른 방 코드" style="width:8em" autocomplete="off"><button class="ghost" id="bJoin">들어가기</button></div>
      <div class="seats">
        <button class="seat" data-s="L"><span class="t"><span class="dot" style="background:#2f6fe0"></span>왼쪽 코트 · 파랑</span><span class="n">비어 있음</span><span class="a">눌러서 앉기</span></button>
        <div class="vs">VS</div>
        <button class="seat" data-s="R"><span class="t"><span class="dot" style="background:#f39a1e"></span>오른쪽 코트 · 주황</span><span class="n">비어 있음</span><span class="a">눌러서 앉기</span></button>
      </div>
      <p class="note" id="lobNote"></p>
      <div class="row"><button class="ghost" id="bWatch">경기 화면 보기</button><button class="ghost" id="bLeave">메인 메뉴</button></div>
    </div>
  </div>

  <div class="ov" id="over" hidden>
    <div class="card sm">
      <h2 id="ovT">승리!</h2>
      <div class="bigscore" id="ovS">11 : 7</div>
      <div class="row"><button class="big" id="bAgain">다시 하기</button><button class="big alt" id="bMenu2">메뉴</button></div>
    </div>
  </div>
  <div id="cut"><div class="band"><b></b><span></span></div></div>
  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas'), bx = bg.getContext('2d');
const coarse = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
const BOT = window.__BOT__ === true;

// ---- 상수 (단위: m, s) ----
const G = 9.8, K = G / (8.5 * 8.5), DT = 1 / 240, TS = 1.2, NETH = 1.55, HALF = 6.7, NMIN = 0.38, PMAX = 7.0;
